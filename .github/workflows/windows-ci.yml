name: Windows CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexusmonitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # The repository bootstrap commit can exist before the source tree is imported.
    if: ${{ hashFiles('package.json') != '' }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Node dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate synchronized version metadata
        run: node scripts/validate-release-version.cjs

      - name: Main-process build and regression tests
        run: npm run test:main

      - name: Renderer type check and production build
        run: npm run build:renderer

      - name: Prepare verified PawnIO MCHBAR resource
        shell: pwsh
        run: ./scripts/fetch-mchbar-module.ps1

      - name: Build .NET hardware service
        run: dotnet build ./HardwareService/HardwareService.csproj -c Release

      - name: Run hardware and storage tests
        run: npm run test:storage

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag/version mismatch: tag=$env:GITHUB_REF_NAME, expected=$expectedTag"
          }

      - name: Build Windows NSIS installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run package:win

      - name: Generate installer checksum
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $installer = "release/NexusMonitor-$version-Setup.exe"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  NexusMonitor-$version-Setup.exe" | Set-Content -Encoding ascii "release/NexusMonitor-$version-Setup.exe.sha256"
          Write-Host "Installer SHA-256: $hash"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $installer = "release/NexusMonitor-$version-Setup.exe"
          $checksum = "release/NexusMonitor-$version-Setup.exe.sha256"
          gh release create $env:GITHUB_REF_NAME $installer $checksum --title "NexusMonitor $version" --generate-notes

      - name: Upload installer as workflow artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: NexusMonitor-${{ github.ref_name }}-Windows-x64
          path: |
            release/NexusMonitor-*-Setup.exe
            release/NexusMonitor-*-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30
